[project]
name = "padel-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "forquesm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.17.1",
    "ultralytics>=8.4.215",
]

[project.scripts]
padel-vision = "padel_vision:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
